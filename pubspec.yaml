name: pixel_world
description: "可探索的复古像素世界地图。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  sembast: ^3.8.10
  sembast_web: ^2.4.6
  crypto: ^3.0.7
  web: ^1.1.1
  json5: ^0.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/
    - assets/data/
    - assets/images/
    - assets/images/hero/
    - assets/images/battle/
